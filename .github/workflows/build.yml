name: Build ScreenSiri

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ScreenSiri
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: iOS/ScreenAssistant/ScreenAssistant.xcodeproj
          scheme: ScreenAssistant
          sdk: iphonesimulator
          action: build
          build-number: ${{ github.run_number }}
