name: Build ScreenSiri Archive

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive ScreenSiri
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: iOS/ScreenAssistant/ScreenAssistant.xcodeproj
          scheme: ScreenAssistant
          configuration: Release
          sdk: iphoneos
          action: archive
          archive-path: .build/Archives/ScreenSiri.xcarchive
          build-number: ${{ github.run_number }}
          build-settings: |
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            CODE_SIGN_STYLE=Manual
            PRODUCT_BUNDLE_IDENTIFIER=pl.13polik.ScreenSiri
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSiri-unsigned-xcarchive
          path: .build/Archives/ScreenSiri.xcarchive
